<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GTA VI Countdown — November 19, 2026</title>
<meta name="description" content="Countdown to Grand Theft Auto VI — releasing November 19, 2026." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@500;700;900&family=Russo+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/svg+xml" href="logo.svg" />
</head>
<body>
<div class="palm-left"></div>
<div class="palm-right"></div>
<div class="sun"></div>
<div class="grid"></div>
<div class="scanlines"></div>
<div class="noise"></div>

<header class="hero">
  <div class="logo-wrap">
    <img src="logo.svg" alt="GTA VI Logo" class="logo" />
  </div>
  <p class="tagline">VICE CITY · RETURN TO PARADISE</p>
</header>

<main class="countdown-section">
  <h2 class="countdown-title">RELEASES IN</h2>
  <div class="countdown" id="countdown">
    <div class="unit"><span class="num" id="months">00</span><span class="label">Months</span></div>
    <div class="unit"><span class="num" id="weeks">00</span><span class="label">Weeks</span></div>
    <div class="unit"><span class="num" id="days">00</span><span class="label">Days</span></div>
    <div class="unit"><span class="num" id="hours">00</span><span class="label">Hours</span></div>
    <div class="unit"><span class="num" id="minutes">00</span><span class="label">Minutes</span></div>
    <div class="unit"><span class="num" id="seconds">00</span><span class="label">Seconds</span></div>
  </div>
  <p class="release-date">NOVEMBER 19, 2026</p>
  <p class="platforms">PLAYSTATION 5 · XBOX SERIES X|S</p>
</main>

<footer>
  <p>FAN-MADE COUNTDOWN · NOT AFFILIATED WITH ROCKSTAR GAMES</p>
</footer>

<script src="script.js"></script>
</body>
</html>
