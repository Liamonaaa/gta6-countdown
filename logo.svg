<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3d9"/>
      <stop offset="40%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#a8005c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b3f7ff"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088a8"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7b3"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)" font-family="'Arial Black', 'Helvetica', sans-serif" font-weight="900" font-style="italic">
    <text x="400" y="160" text-anchor="middle" font-size="180" fill="url(#pinkGrad)" stroke="#1a0033" stroke-width="6" letter-spacing="-4">GRAND</text>
    <text x="400" y="160" text-anchor="middle" font-size="180" fill="url(#pinkGrad)" letter-spacing="-4">GRAND</text>

    <text x="180" y="290" text-anchor="middle" font-size="140" fill="url(#cyanGrad)" stroke="#1a0033" stroke-width="6" letter-spacing="-4">THEFT</text>
    <text x="180" y="290" text-anchor="middle" font-size="140" fill="url(#cyanGrad)" letter-spacing="-4">THEFT</text>

    <text x="430" y="290" text-anchor="middle" font-size="140" fill="url(#yellowGrad)" stroke="#1a0033" stroke-width="6" letter-spacing="-4">AUTO</text>
    <text x="430" y="290" text-anchor="middle" font-size="140" fill="url(#yellowGrad)" letter-spacing="-4">AUTO</text>

    <text x="690" y="300" text-anchor="middle" font-size="170" fill="url(#pinkGrad)" stroke="#1a0033" stroke-width="6" letter-spacing="-4">VI</text>
    <text x="690" y="300" text-anchor="middle" font-size="170" fill="url(#pinkGrad)" letter-spacing="-4">VI</text>
  </g>
</svg>
